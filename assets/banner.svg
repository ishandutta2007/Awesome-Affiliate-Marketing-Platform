<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#07152b"/>
      <stop offset="100%" stop-color="#020712"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="12"/>

  <!-- Dynamic Animated / Glowing Background Network Graphic (Behind Text) -->
  <g opacity="0.4">
    <!-- Grid Overlay -->
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M100 0 V350 M200 0 V350 M300 0 V350 M400 0 V350 M500 0 V350 M600 0 V350 M700 0 V350 M800 0 V350 M900 0 V350 M1000 0 V350 M1100 0 V350" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Dynamic Curved Data Wave Lines -->
    <path d="M-50 280 Q 200 120 450 220 T 950 150 T 1250 280" fill="none" stroke="url(#cyan-glow)" stroke-width="3" filter="url(#glow)">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M-50 280 Q 200 120 450 220 T 950 150 T 1250 280;
                M-50 250 Q 250 180 500 140 T 900 220 T 1250 250;
                M-50 280 Q 200 120 450 220 T 950 150 T 1250 280" />
    </path>

    <path d="M-50 100 Q 300 300 650 180 T 1250 100" fill="none" stroke="url(#purple-glow)" stroke-width="2" filter="url(#glow)">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M-50 100 Q 300 300 650 180 T 1250 100;
                M-50 150 Q 350 100 600 250 T 1250 150;
                M-50 100 Q 300 300 650 180 T 1250 100" />
    </path>

    <!-- Network Nodes on Right Side -->
    <g transform="translate(850, 60)">
      <line x1="100" y1="100" x2="200" y2="40" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="100" y1="100" x2="220" y2="120" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="100" y1="100" x2="160" y2="190" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="200" y1="40" x2="220" y2="120" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      
      <!-- Pulsing Node Circles -->
      <circle cx="100" cy="100" r="8" fill="#38bdf8" filter="url(#glow)">
        <animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="40" r="5" fill="#818cf8"/>
      <circle cx="220" cy="120" r="6" fill="#c084fc"/>
      <circle cx="160" cy="190" r="5" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Foreground Foreground Container Frame / Border Glow -->
  <rect x="2" y="2" width="1196" height="346" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="25" y="25" width="1150" height="300" rx="8" fill="none" stroke="url(#cyan-glow)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Foreground Title and Subtitle Content (High Contrast & Clear) -->
  <g transform="translate(70, 0)">
    <!-- Badge -->
    <g transform="translate(0, 55)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="15" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">🚀 CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.5">
      Awesome Affiliate Marketing Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      The Ultimate Open-Source &amp; SaaS Affiliate Infrastructure Directory
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 235)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">📊 SaaS &amp; Market Metrics</text>

      <!-- Pill 2 -->
      <rect x="195" y="0" width="195" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="209" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">⭐ Star-Ranked Open Source</text>

      <!-- Pill 3 -->
      <rect x="405" y="0" width="200" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="419" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🛠️ Architecture Blueprints</text>
    </g>
  </g>
</svg>
